name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el zip
        run: |
          ZIP=$(find . -maxdepth 3 -iname "*.zip" -not -path "./.git/*" | head -n 1)
          echo "Zip encontrado: $ZIP"
          unzip -o "$ZIP" -d fuente
          ls -R fuente | head -30

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compilar APK
        run: |
          DIR=$(dirname "$(find fuente -name settings.gradle | head -n 1)")
          cd "$DIR"
          gradle assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ConversorUnidades-APK
          path: fuente/**/app/build/outputs/apk/debug/app-debug.apk
